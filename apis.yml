name: Witness Systems
description: Witness Systems, Inc. was a workforce optimization software company founded in 1988
  and headquartered in Roswell, Georgia. It built quality monitoring, call and screen recording, and
  performance management software for contact centers, sold under the Impact 360 and eQuality product
  lines, and traded publicly on NASDAQ under the ticker WITS. Verint Systems acquired Witness Systems
  in 2007 for approximately $950 million, folding its products into Verint's Workforce Optimization
  suite. The company no longer operates as an independent entity and publishes no public API; its
  former domain (witnesssystems.com) no longer resolves.
